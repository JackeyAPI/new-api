services:
  gateway:
    image: jackey-newapi:35ae042-amd64
    container_name: jackey-newapi-demo
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file: demo.env
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
